[workspace]
resolver = "2"
members = [
    # Core library crates
    "crates/randstat-core",
    "crates/randstat-tests",
    # Suite crates (each is an independent no_std crate)
    "crates/randstat-suite-ent",
    "crates/randstat-suite-nist",
    "crates/randstat-suite-sp800-90b",
    "crates/randstat-suite-ais31",
    "crates/randstat-suite-dieharder",
    "crates/randstat-suite-testu01",
    "crates/randstat-suite-practrand",
    "crates/randstat-suite-gjrand",
    "crates/randstat-suite-full",
    # Applications
    "apps/randstat-cli",
    "apps/randstat-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[workspace.dependencies]
# Core crates
randstat-core          = { path = "crates/randstat-core" }
randstat-tests         = { path = "crates/randstat-tests" }
# Suite crates
randstat-suite-ent       = { path = "crates/randstat-suite-ent" }
randstat-suite-nist      = { path = "crates/randstat-suite-nist" }
randstat-suite-sp800-90b = { path = "crates/randstat-suite-sp800-90b" }
randstat-suite-ais31     = { path = "crates/randstat-suite-ais31" }
randstat-suite-dieharder = { path = "crates/randstat-suite-dieharder" }
randstat-suite-testu01   = { path = "crates/randstat-suite-testu01" }
randstat-suite-practrand = { path = "crates/randstat-suite-practrand" }
randstat-suite-gjrand    = { path = "crates/randstat-suite-gjrand" }
randstat-suite-full      = { path = "crates/randstat-suite-full" }
# Third-party
libm = "0.2"

[profile.dev]
panic = "abort"

[profile.release]
panic         = "abort"
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = "symbols"

[profile.release.package.randstat-cli]
opt-level = 3

[profile.release.package.randstat-core]
opt-level = 3

[profile.release.package.randstat-tests]
opt-level = 3

[profile.release.package.randstat-suite-ent]
opt-level = 3

[profile.release.package.randstat-suite-nist]
opt-level = 3

[profile.release.package.randstat-suite-sp800-90b]
opt-level = 3

[profile.release.package.randstat-suite-ais31]
opt-level = 3

[profile.release.package.randstat-suite-dieharder]
opt-level = 3

[profile.release.package.randstat-suite-testu01]
opt-level = 3

[profile.release.package.randstat-suite-practrand]
opt-level = 3

[profile.release.package.randstat-suite-gjrand]
opt-level = 3

[profile.release.package.randstat-suite-full]
opt-level = 3

